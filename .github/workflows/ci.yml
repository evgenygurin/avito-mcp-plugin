name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  servers:
    name: MCP-серверы (${{ matrix.server }} — lint + types + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [gateway, scraper, db, notify]
    defaults:
      run:
        working-directory: servers/${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Синхронизировать зависимости (uv-workspace)
        run: uv sync --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      # Тесты хранилища (gateway) требуют живой Postgres и пропускаются без
      # DSN — это ожидаемо.
      - name: pytest
        run: uv run pytest -q

  manifests:
    name: Манифесты плагина
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Синхронность версий в 5 манифестах
        run: python3 scripts/check_versions.py