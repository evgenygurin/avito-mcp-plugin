[project]
name = "avito-mcp-server"
version = "0.4.0"
description = "Gateway-адapter (FastMCP v3): композиция движка scraper + делегация в db (Фаза 3)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "evgenygurin", email = "e.a.gurin@outlook.com" }]
dependencies = [
    "fastmcp>=3.0.0,<4",
    # Члены uv-workspace: тяжёлый движок парсинга (scraper), db-хранилище/экспорт,
    # общие утилиты и скелет уведом provider.
    "avito-mcp-shared",
    "avito-mcp-scraper",
    "avito-mcp-db",
    "avito-mcp-notify",
]

[tool.uv.sources]
avito-mcp-shared = { workspace = true }
avito-mcp-scraper = { workspace = true }
avito-mcp-db = { workspace = true }
avito-mcp-notify = { workspace = true }

[project.optional-dependencies]
playwright = ["playwright>=1.40"]

[project.scripts]
avito-mcp-server = "avito_mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
explicit_package_bases = true
mypy_path = ["src"]