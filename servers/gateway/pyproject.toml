[project]
name = "avito-mcp-server"
version = "0.3.0"
description = "Gateway-сервер (FastMCP v3): композиция скаффолдинга avito-mcp + 7 тулз"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "evgenygurin", email = "e.a.gurin@outlook.com" }]
dependencies = [
    "fastmcp>=3.0.0,<4",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1.5",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # Члены uv-workspace: общие утилиты и скелеты серверов для композиции.
    "avito-mcp-shared",
    "avito-mcp-scraper",
    "avito-mcp-db",
    "avito-mcp-notify",
]

[tool.uv.sources]
avito-mcp-shared = { workspace = true }
avito-mcp-scraper = { workspace = true }
avito-mcp-db = { workspace = true }
avito-mcp-notify = { workspace = true }

[project.optional-dependencies]
playwright = ["playwright>=1.40"]

[project.scripts]
avito-mcp-server = "avito_mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "types-openpyxl>=3.1.5.20260518",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
explicit_package_bases = true
mypy_path = ["src"]
